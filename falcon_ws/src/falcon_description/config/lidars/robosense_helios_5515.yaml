# RoboSense Helios 5515 (32 channels, uneven).
# -55 to +15 deg: 3 deg apart below -10, 1.33 deg from -8 to +4, 2 deg apart at the
# top (channel table, RS-Helios-5515 user guide V3.0.1, p. 17); 0.2 deg horizontal at
# 10 Hz (p. 16).  Simulated as 4 Gazebo ray sensors merged into one cloud.
name: RoboSense Helios 5515
kind: spinning
rate_hz: 10
horizontal: {fov_deg: 360, samples: 1800}
vertical:
  angles_deg: [-55, -52, -49, -46, -43, -40, -37, -34, -31, -28, -25, -22, -19, -16, -13,
               -10, -8, -6.67, -5.33, -4, -2.67, -1.33, 0, 1.33, 2.67, 4, 5.5, 7, 9, 11,
               13, 15]
range: {min_m: 0.3, max_m: 110.0}   # 110 m at 10% NIST, 150 m max (robosense.ai/rslidar/Helios)
noise_stddev_m: 0.02
