path_planner_node:
  ros__parameters:
    # --- Input topics ---
    cones_topic: "/falcon/fused_cones"
    map_topic: "/map/cone_map"

    # --- Output topics ---
    path_topic: "/planning/path"
    markers_topic: "/planning/cone_markers"
    lap_topic: "/planning/lap_count"

    # --- Frames ---
    map_frame: "map"
    base_frame: "base_footprint"
    path_frame: "map"            # pure pursuit moves the path into the car frame at control time

    # --- Planning (see falcon_planning/centerline.py) ---
    plan_rate_hz: 20.0
    use_map: true
    live_cone_timeout_s: 0.5
    window_radius_m: 30.0        # cones further than this from the car are ignored
    track_width_m: 3.0           # virtual cone offset when one side is not seen
    min_track_width_m: 1.8
    max_track_width_m: 6.0       # left-right gaps above this are not the track
    max_path_length_m: 25.0
    resample_step_m: 0.5

    # --- Map merge ---
    dedup_radius_m: 1.0

    # --- Lap counting ---
    # 0 = unlimited laps; the planner stops publishing paths after total_laps
    total_laps: 0
    orange_detect_radius_m: 3.0
